<aside class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-brand">

      <div class="sidebar-logo">
        TJ
      </div>

      <div class="sidebar-brand-copy">
        <span class="sidebar-app-name">
          {{ i18n.t('common.appName') }}
        </span>

        <span class="sidebar-workspace">
          Workspace
        </span>
      </div>

    </div>

    <button
      type="button"
      class="sidebar-close"
      (click)="onClose()"
      aria-label="Close sidebar"
    >
      ×
    </button>

  </div>


  <div class="sidebar-intro">
    <span>TRADE JOURNAL</span>

    <p>
      Your trading workspace.
    </p>
  </div>


  <nav class="sidebar-nav">

    <div class="sidebar-section">

      <button
        type="button"
        class="sidebar-section-button"
        (click)="toggleTradeMenu()"
      >
        <span class="sidebar-section-title">
          Trade
        </span>

        <span class="sidebar-section-icon">
          {{ tradeMenuOpen() ? '−' : '+' }}
        </span>
      </button>


      @if (tradeMenuOpen()) {

        <div class="sidebar-links">

          <a
            routerLink="/app/trades"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="sidebar-link"
            (click)="onNavigate()"
          >
            <span>Overview</span>
          </a>

          <a
            routerLink="/app/trades/new"
            routerLinkActive="active"
            class="sidebar-link"
            (click)="onNavigate()"
          >
            <span>New Trade</span>
          </a>

          <a
            routerLink="/app/trades/list"
            routerLinkActive="active"
            class="sidebar-link"
            (click)="onNavigate()"
          >
            <span>Trade List</span>
          </a>

          <a
            routerLink="/app/trades/import"
            routerLinkActive="active"
            class="sidebar-link"
            (click)="onNavigate()"
          >
            <span>Import Trade</span>
          </a>

        </div>

      }

    </div>

  </nav>

</aside>
