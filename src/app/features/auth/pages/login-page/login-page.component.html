<app-auth-shell activeView="login">

  <div class="login-content">

    <div class="login-heading">
      <span class="login-eyebrow">
        AUTH / LOGIN
      </span>

      <h2>
        {{ i18n.t('auth.login.title') }}
      </h2>

      <p>
        {{ i18n.t('auth.login.subtitle') }}
      </p>
    </div>

    @if (submitError()) {
      <div class="login-error">
        <span class="error-icon">!</span>

        <div>
          <strong>ACCESS DENIED</strong>
          <span>{{ submitError() }}</span>
        </div>
      </div>
    }

    <form
      class="login-form"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >

      <label class="field">
        <span class="field-label">
          {{ i18n.t('auth.login.email') }}
        </span>

        <input
          type="email"
          formControlName="email"
          placeholder="trader@example.com"
          autocomplete="email"
        />
      </label>

      <label class="field">
        <span class="field-label">
          {{ i18n.t('auth.login.password') }}
        </span>

        <input
          type="password"
          formControlName="password"
          [placeholder]="i18n.t('auth.login.passwordPlaceholder')"
          autocomplete="current-password"
        />
      </label>

      <button
        type="submit"
        class="auth-submit"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="submit-loading">
            <span class="loading-dot"></span>
            AUTHENTICATING...
          </span>
        } @else {
          <span>{{ i18n.t('auth.login.submit') }}</span>
          <span class="submit-arrow">→</span>
        }
      </button>

    </form>

    <div class="login-register">
      <span>
        {{ i18n.t('auth.login.noAccount') }}
      </span>

      <a routerLink="/register">
        {{ i18n.t('auth.login.createOne') }}
        <span>→</span>
      </a>
    </div>

    @if (authService.isAuthenticated()) {
      <div class="existing-session">
        <div>
          <span class="session-dot"></span>
          SESSION ACTIVE
        </div>

        <button
          type="button"
          (click)="goToApp()"
        >
          {{ i18n.t('common.actions.openProtectedPage') }}
          →
        </button>
      </div>
    }

  </div>

</app-auth-shell>
