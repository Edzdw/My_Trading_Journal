<app-auth-shell activeView="register">

  <div class="register-content">

    <div class="register-heading">
      <span class="register-eyebrow">
        AUTH / REGISTER
      </span>

      <h2>
        {{ i18n.t('auth.register.title') }}
      </h2>

      <p>
        {{ i18n.t('auth.register.subtitle') }}
      </p>
    </div>

    @if (submitError()) {
      <div class="register-error">
        <span class="error-icon">!</span>

        <div>
          <strong>REGISTRATION FAILED</strong>
          <span>{{ submitError() }}</span>
        </div>
      </div>
    }

    <form
      class="register-form"
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
    >

      <label class="field">
        <span class="field-label">
          {{ i18n.t('auth.register.email') }}
        </span>

        <input
          type="email"
          formControlName="email"
          placeholder="trader@example.com"
          autocomplete="email"
        />

        @if (registerForm.controls.email.touched && registerForm.controls.email.invalid) {
          <span class="field-error">
            @if (registerForm.controls.email.hasError('required')) {
              Email là bắt buộc.
            } @else if (registerForm.controls.email.hasError('email')) {
              Email không hợp lệ.
            }
          </span>
        }
      </label>

      <label class="field">
        <span class="field-label">
          {{ i18n.t('auth.register.password') }}
        </span>

        <input
          type="password"
          formControlName="password"
          [placeholder]="i18n.t('auth.register.passwordPlaceholder')"
          autocomplete="new-password"
        />

        @if (registerForm.controls.password.touched && registerForm.controls.password.invalid) {
          <span class="field-error">
            @if (registerForm.controls.password.hasError('required')) {
              Mật khẩu là bắt buộc.
            } @else if (registerForm.controls.password.hasError('minlength')) {
              Mật khẩu phải có ít nhất 8 ký tự.
            }
          </span>
        }
      </label>

      <button
        type="submit"
        class="auth-submit"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="submit-loading">
            <span class="loading-dot"></span>
            {{ i18n.t('auth.register.submitting') }}
          </span>
        } @else {
          <span>
            {{ i18n.t('auth.register.submit') }}
          </span>

          <span class="submit-arrow">→</span>
        }
      </button>

    </form>

    <div class="register-login">
      <span>
        {{ i18n.t('auth.register.existingAccount') }}
      </span>

      <a routerLink="/login">
        {{ i18n.t('auth.register.signInHere') }}
        <span>→</span>
      </a>
    </div>

  </div>

</app-auth-shell>
